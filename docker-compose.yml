# Optional backing services. The solution runs fully in-memory without this file.
#   docker compose --profile real up -d
services:
  postgres:
    image: postgres:16-alpine
    profiles: [real]
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [real]
    ports: ["6379:6379"]

  redpanda:
    # Kafka-compatible broker, single binary, no ZooKeeper. Used from v2 (event-driven analytics).
    image: redpandadata/redpanda:v24.3.5
    profiles: [real]
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: ["9092:9092"]

  shortener:
    profiles: [real]
    build:
      context: .
      dockerfile: src/Shortener.Api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Shortener__Storage: Postgres
      Shortener__BaseUrl: http://localhost:8080
      ConnectionStrings__Postgres: Host=postgres;Username=shortener;Password=shortener;Database=shortener
      ConnectionStrings__Redis: redis:6379
    ports: ["8080:8080"]
