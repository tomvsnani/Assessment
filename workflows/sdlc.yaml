# The software delivery lifecycle every run follows. Scenario presets in scenarios/ and ad-hoc
# requirements both run this graph; what differs is the requirement text and the workspace baseline.
# Stage graph:
#   requirements -> design -> plan -> {implement, test-design} -> verify -> {review, docs} -> release
# Braces are parallel branches. verify/review failing loops back to implement (bounded).
# on_failure.mode: fix (default) keeps the implementer's files so it makes the smallest change
# with the failure in front of it; rollback restores its checkpoint and starts over. Rollback is
# what happens on safe-stop anyway, so fix → exhausted budget → rollback → human is the ladder.
name: sdlc
max_parallel: 3

stages:
  - id: requirements
    agent: requirements
    retry: { max_attempts: 2, base_delay_seconds: 2 }
    exit:
      artifacts: [spec]
      policies: [no-secrets]
      approval: approve-spec

  - id: design
    agent: architect
    depends_on: [requirements]
    retry: { max_attempts: 2, base_delay_seconds: 2 }
    exit:
      artifacts: [design]
      policies: [no-secrets]
      approval: approve-design

  - id: plan
    agent: planner
    depends_on: [design]
    retry: { max_attempts: 2, base_delay_seconds: 2 }
    exit:
      artifacts: [plan]

  - id: implement
    agent: implementer
    depends_on: [plan]
    retry: { max_attempts: 2, base_delay_seconds: 5 }
    exit:
      artifacts: [implementation]
      policies: [no-secrets, pii-in-logs, schema-change-needs-approval]

  - id: test-design
    agent: test-designer
    depends_on: [plan]
    retry: { max_attempts: 2, base_delay_seconds: 2 }
    exit:
      artifacts: [test-plan]

  - id: verify
    agent: verifier
    depends_on: [implement, test-design]
    exit:
      artifacts: [test-report]
    on_failure:
      rerun_from: implement
      max_loops: 2
      mode: fix

  - id: review
    agent: reviewer
    depends_on: [verify]
    retry: { max_attempts: 3, base_delay_seconds: 2 }
    entry:
      policies: [segregation-of-duties]
    exit:
      artifacts: [review]
    on_failure:
      rerun_from: implement
      max_loops: 1
      mode: fix

  - id: docs
    agent: doc-writer
    depends_on: [verify]
    retry: { max_attempts: 2, base_delay_seconds: 2 }
    exit:
      artifacts: [documentation]
      policies: [no-secrets, pii-in-logs]

  - id: release
    agent: release-manager
    depends_on: [review, docs]
    retry: { max_attempts: 2, base_delay_seconds: 2 }
    exit:
      artifacts: [change-record]
      approval: approve-release
